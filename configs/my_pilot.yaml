name: my_pilot
description: >
  Pilot-scale comparison across all 8 propulsion systems on LEO-GEO transfer,
  mirroring the mentor's pilot_economics scope but with full system coverage.

propulsion: all

missions:
  - leo_geo_transfer

agents:
  - random
  - max_thrust
  - prograde
  - edelbaum
  - ppo
  - sac

cost_models:
  - reference

seeds: 8
train_steps: 50000
eval_interval: 500
val_episodes: 3
eval_episodes: 4

report_policy: best
selection_metric: return

env:
  max_episode_steps: 8760

results_dir: results
workers: 4
save_telemetry: true